
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List a Book - Campus Book Exchange</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>Campus Book Exchange</h1>
        <p>Share Books, Share Knowledge!</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="books.html">Browse Books</a>
        <a href="list-book.html">List a Book</a>
    </nav>

    <main class="form-page">

        <h2 id="formHeading">List Your Book</h2>

        <p class="intro">
            Have a book you no longer need? Share it with your fellow students!
        </p>

        <div class="form-buttons">
            <button type="button" onclick="changeFormHeading()">
                Change Heading Size
            </button>

            <button type="button" onclick="toggleListingForm()">
                Show / Hide Form
            </button>
        </div>

        <div class="form-container" id="formContainer">

            <form id="bookForm" onsubmit="submitListing(event)">

                <label for="studentName">Student Name:</label>
                <input type="text" id="studentName"
                       placeholder="Enter your name">

                <label for="listingTitle">Book Title:</label>
                <input type="text" id="listingTitle"
                       placeholder="Enter book title">

                <label for="author">Author:</label>
                <input type="text" id="author"
                       placeholder="Enter author's name">

                <label for="category">Subject / Category:</label>
                <select id="category">
                    <option value="">Select a category</option>
                    <option value="Programming">Programming</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Mathematics">Mathematics</option>
                    <option value="Science">Science</option>
                    <option value="Fiction">Fiction</option>
                    <option value="Self-Help">Self-Help</option>
                    <option value="Other">Other</option>
                </select>

                <label for="condition">Book Condition:</label>
                <select id="condition">
                    <option value="">Select book condition</option>
                    <option value="Excellent">Excellent</option>
                    <option value="Very Good">Very Good</option>
                    <option value="Good">Good</option>
                    <option value="Fair">Fair</option>
                </select>

                <button type="submit">Submit Book Listing</button>

            </form>

        </div>

        <div id="formMessage" class="message" aria-live="polite"></div>

    </main>

    <footer>
        <p>© 2026 Campus Book Exchange | Made for Students</p>
    </footer>

</body>
</html>
